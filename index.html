<body>
  <h2>Forex Alerts</h2>
  <p id="status">Push Status: unbekannt</p>
  <button id="enablePush">Push aktivieren</button>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("enablePush");

    btn.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        statusEl.innerText = "Push nicht unterstützt";
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        statusEl.innerText = "Push abgelehnt";
        return;
      }

      const registration = await navigator.serviceWorker.ready;

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: "<HIER KOMMT DER VAPID KEY>"
      });

      alert(JSON.stringify(subscription));

      statusEl.innerText = "Push aktiviert (siehe Konsole)";
    });
  </script>
</body>

<body>
  <h2>Forex Alerts</h2>
  <p id="status">Push Status: unbekannt</p>
  <button id="enablePush">Push aktivieren</button>

  <script>
    const publicVapidKey = "BBw-2UrGVg8hpNxfb5l0IWd-sGDfwAXp2MVV7I0n6EjWYiCb_Rj2oBEJC80egGYAKfKA71Xi-HDOfsd_o08_2U4";

    // 🔧 Pflicht-Funktion für Web Push
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("enablePush");

    btn.addEventListener("click", async () => {

      if (!("Notification" in window)) {
        statusEl.innerText = "Push nicht unterstützt";
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        statusEl.innerText = "Push abgelehnt";
        return;
      }

      const registration = await navigator.serviceWorker.ready;

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
      });

      console.log(JSON.stringify(subscription));
      document.body.innerHTML += `<pre>${JSON.stringify(subscription, null, 2)}</pre>`;
      statusEl.innerText = "Push aktiviert";
    });
  </script>
</body>

<body>
  <h2>Forex Alerts</h2>
  <p id="status">Push Status: unbekannt</p>
  <button id="enablePush">Push aktivieren</button>

  <script>
    const publicVapidKey = "BBw-2UrGVg8hpNxfb5l0IWd-sGDfwAXp2MVV7I0n6EjWYiCb_Rj2oBEJC80egGYAKfKA71Xi-HDOfsd_o08_2U4";

    // 🔧 Pflicht-Funktion für Web Push
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("enablePush");

    btn.addEventListener("click", async () => {

  const registration = await navigator.serviceWorker.ready;

  // 🔎 Prüfen, ob bereits eine Subscription existiert
  const existingSub = await registration.pushManager.getSubscription();

  if (existingSub) {
    statusEl.innerText = "Bestehende Subscription gefunden";
    document.body.innerHTML += `<pre>${JSON.stringify(existingSub, null, 2)}</pre>`;
    return;
  }

  // 🔔 Falls noch keine existiert → neu abonnieren
  const subscription = await registration.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
  });

  statusEl.innerText = "Neue Subscription erstellt";
  document.body.innerHTML += `<pre>${JSON.stringify(subscription, null, 2)}</pre>`;
});


      console.log(JSON.stringify(subscription));
      document.body.innerHTML += `<pre>${JSON.stringify(subscription, null, 2)}</pre>`;
      statusEl.innerText = "Push aktiviert";
    });
  </script>
</body>
